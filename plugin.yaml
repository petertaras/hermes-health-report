name: hermes-health-report
version: 0.1.1
requires_hermes: ">=0.23.2"
description: Profile-local health reports for Hermes.
python_dependencies:
  - "PyYAML>=6.0.3,<7"
requires_env:
  - name: EMAIL_PASSWORD
    description: Only needed for authenticated SMTP delivery.
    secret: true
  - name: GITHUB_TOKEN
    description: Optional token for GitHub release metadata lookups.
    secret: true
provides_hooks:
  - kanban_task_completed
