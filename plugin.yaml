name: hermes-health-report
version: 0.1.1
requires_hermes: ">=0.23.2"
description: Profile-local health reports for Hermes.
python_dependencies:
  - "PyYAML>=6.0.2,<7"
requires_env:
  - name: HEALTH_REPORT_GRAPH_CLIENT_ID
    description: Microsoft Entra public client ID. Only needed for Microsoft Graph delivery.
  - name: EMAIL_PASSWORD
    description: Only needed for authenticated SMTP delivery.
    secret: true
  - name: GITHUB_TOKEN
    description: Optional token for GitHub release metadata lookups.
    secret: true
provides_hooks:
  - kanban_task_completed
oauth:
  - id: graph
    authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    client_id_env: HEALTH_REPORT_GRAPH_CLIENT_ID
    hosts: [graph.microsoft.com]
    scopes: [User.Read, Mail.Send, Mail.Read, offline_access]
